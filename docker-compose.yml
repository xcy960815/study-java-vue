# 变量在 env/.env.prod：docker compose --env-file env/.env.prod up -d
services:
  vue:
    image: ${VUE_WEB_IMAGE_NAME}:${VUE_WEB_IMAGE_VERSION}
    container_name: study-java-vue-container
    ports:
      - '${VUE_WEB_PORT}:80'
    environment:
      - TZ=${TIMEZONE}
    networks:
      - study-java-network
    logging:
      driver: json-file
      options:
        max-size: '${LOG_MAX_SIZE}'
        max-file: '${LOG_MAX_FILE}'
    restart: always

networks:
  study-java-network:
    external: true
    name: ${DOCKER_NETWORK_NAME}
